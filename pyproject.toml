[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trade-os"
version = "0.1.0"
description = "Local-first quantitative research, validation and guarded trading system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "critical: safety-critical test; any failure blocks merge",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]          # never reformat code blocks inside docs
extend-exclude = ["src/trade/web/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",   # assert is used in tests
    "S311",   # random is used for seeded simulation, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108"]  # fixture secrets, bind and temp-path literals

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["trade"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true


[tool.importlinter]
root_package = "trade"

[[tool.importlinter.contracts]]
name = "Core does not depend on outer layers"
type = "forbidden"
source_modules = ["trade.core"]
forbidden_modules = [
    "trade.strategies", "trade.brokers", "trade.backtesting", "trade.paper",
    "trade.web", "trade.agents", "trade.research", "trade.data",
]

[[tool.importlinter.contracts]]
name = "Strategies never touch brokers, execution adapters or agents"
type = "forbidden"
source_modules = ["trade.strategies"]
forbidden_modules = ["trade.brokers", "trade.agents", "trade.web", "trade.paper"]

[[tool.importlinter.contracts]]
name = "Agents never touch brokers or the risk engine"
type = "forbidden"
source_modules = ["trade.agents"]
forbidden_modules = ["trade.brokers", "trade.core.risk", "trade.paper"]
